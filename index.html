<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobhan Family Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b141a;color:#e9edef;height:100vh;overflow:hidden}.hidden{display:none!important}
#auth{height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at center,#17252d,#0b141a 65%)}.card{width:min(430px,100%);background:#202c33;border-radius:18px;padding:28px;box-shadow:0 15px 50px #0008}.logo{width:70px;height:70px;border-radius:50%;background:#00a884;display:grid;place-items:center;font-size:27px;font-weight:700;margin:0 auto 16px}.card h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#8696a0;margin-bottom:22px}.tabs{display:flex;background:#111b21;border-radius:9px;padding:4px;margin-bottom:16px}.tabs button{flex:1;border:0;padding:10px;border-radius:7px;background:transparent;color:#aebac1;cursor:pointer}.tabs button.active{background:#00a884;color:#fff}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#aebac1;margin-bottom:6px}.field input{width:100%;border:0;outline:0;border-radius:9px;background:#111b21;color:#fff;padding:12px}.primary{width:100%;border:0;border-radius:9px;padding:12px;background:#00a884;color:#fff;cursor:pointer;font-size:15px;margin-top:12px}.msg{min-height:24px;margin-top:10px;text-align:center;color:#ffb4a8;font-size:13px}
#app{height:100vh;display:flex;background:#111b21}.sidebar{width:360px;border-left:1px solid #26343b;background:#111b21;display:flex;flex-direction:column}.topbar{height:70px;background:#202c33;padding:10px 15px;display:flex;align-items:center;justify-content:space-between}.avatar{width:44px;height:44px;border-radius:50%;background:#00a884;display:grid;place-items:center;font-weight:700}.top-actions{display:flex;gap:18px;font-size:22px;color:#d1d7db}.search{padding:10px}.search input{width:100%;padding:12px 15px;background:#202c33;color:#fff;border:0;border-radius:8px;outline:0}.members{overflow:auto;flex:1}.member{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid #202c33;cursor:pointer}.member:hover{background:#202c33}.member-info{flex:1}.member-name{font-size:15px}.member-sub{font-size:12px;color:#8696a0;margin-top:5px}.main{flex:1;display:flex;flex-direction:column;background:#0b141a}.header{height:70px;background:#202c33;padding:10px 16px;display:flex;align-items:center;gap:12px}.head-info{flex:1}.head-name{font-size:16px}.head-status{font-size:12px;color:#8696a0;margin-top:4px}.logout{border:0;background:transparent;color:#d1d7db;cursor:pointer;font-size:13px}.messages{flex:1;overflow:auto;padding:24px 6%;background:radial-gradient(circle at center,#17252d 0,#0b141a 70%)}.bubble{max-width:72%;padding:9px 12px;margin:8px 0;border-radius:8px;line-height:1.7;clear:both;word-wrap:break-word}.me{float:right;background:#005c4b}.other{float:left;background:#202c33}.sender{font-size:11px;color:#8bd3c1;margin-bottom:3px}.composer{display:flex;gap:10px;padding:10px;background:#202c33}.composer input{flex:1;border:0;outline:0;border-radius:9px;background:#2a3942;color:#fff;padding:13px}.send{width:50px;height:50px;border:0;border-radius:50%;background:#00a884;color:#fff;font-size:20px;cursor:pointer}.empty{margin:auto;text-align:center;color:#8696a0}.danger{color:#ff8f8f}
@media(max-width:750px){.sidebar{width:100%}.main{display:none}.mobile-chat .sidebar{display:none}.mobile-chat .main{display:flex}}
</style>
</head>
<body>
<section id="auth">
 <div class="card">
  <div class="logo">S</div><h1>Sobhan Family Chat</h1><div class="sub">پیام‌رسان خصوصی خانواده</div>
  <div class="tabs"><button id="tabLogin" class="active">ورود</button><button id="tabSignup">ثبت‌نام</button></div>
  <form id="authForm">
   <div class="field"><label>ایمیل</label><input id="email" type="email" required placeholder="name@example.com"></div>
   <div class="field"><label>رمز عبور</label><input id="password" type="password" required minlength="6" placeholder="حداقل ۶ کاراکتر"></div>
   <div class="field signupOnly hidden"><label>نام شما</label><input id="name" type="text" placeholder="مثلاً سبحان"></div>
   <button class="primary" id="submitBtn" type="submit">ورود</button><div id="authMsg" class="msg"></div>
  </form>
  <div class="sub" style="margin:16px 0 0;font-size:11px">این نسخه برای اعضای مجاز خانواده است. ثبت‌نام عمومی را بعداً می‌توان از تنظیمات Auth بست.</div>
 </div>
</section>
<section id="app" class="hidden">
 <aside class="sidebar">
  <div class="topbar"><div class="avatar" id="myAvatar">S</div><div class="top-actions"><span>⌕</span><span>⋮</span></div></div>
  <div class="search"><input id="search" placeholder="جستجوی اعضای خانواده"></div>
  <div class="members" id="members"></div>
 </aside>
 <main class="main">
  <div class="header"><div class="avatar" id="headAvatar">👨‍👩‍👧‍👦</div><div class="head-info"><div class="head-name" id="headName">گروه خانواده ❤️</div><div class="head-status" id="headStatus">اتصال در حال بررسی...</div></div><button class="logout" id="logout">خروج</button></div>
  <div id="messages" class="messages"><div class="empty">یک عضو خانواده را انتخاب کن.</div></div>
  <div class="composer"><input id="text" placeholder="پیام خود را بنویسید..." disabled><button id="send" class="send" disabled>➤</button></div>
 </main>
</section>
<script>
const SUPABASE_URL = 'https://rahpltlgzcobmenuoiqd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2ZdKdM9fIF53_jnKrdgWnA_ixsn6hbA';
const configured=!SUPABASE_URL.includes('PASTE_')&&!SUPABASE_KEY.includes('PASTE_');
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let currentUser=null,currentConversation=null,realtimeChannel=null,membersCache=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setMsg(t,good=false){$('authMsg').textContent=t;$('authMsg').style.color=good?'#9be7cf':'#ffb4a8'}
let mode='login';
$('tabLogin').onclick=()=>setMode('login');$('tabSignup').onclick=()=>setMode('signup');
function setMode(m){mode=m;$('tabLogin').classList.toggle('active',m==='login');$('tabSignup').classList.toggle('active',m==='signup');document.querySelectorAll('.signupOnly').forEach(x=>x.classList.toggle('hidden',m!=='signup'));$('submitBtn').textContent=m==='login'?'ورود':'ساخت حساب';setMsg('')}
$('authForm').onsubmit=async e=>{e.preventDefault();if(!configured){setMsg('اول در ابتدای فایل index.html آدرس و Publishable Key مربوط به Supabase را وارد کن.');return}const email=$('email').value.trim(),password=$('password').value; if(mode==='login'){const {error}=await sb.auth.signInWithPassword({email,password});if(error){setMsg(error.message);return}}else{const name=$('name').value.trim();const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error){setMsg(error.message);return}if(!data.session){setMsg('حساب ساخته شد. ایمیل را تأیید کن و سپس وارد شو.',true);return}}await boot()};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('search').oninput=()=>renderMembers($('search').value.trim().toLowerCase());
$('send').onclick=sendMessage;$('text').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
async function boot(){if(!configured){$('auth').classList.remove('hidden');return}const {data}=await sb.auth.getSession();if(data.session){currentUser=data.session.user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadMembers();await openFamilyGroup()}else{$('auth').classList.remove('hidden')}}
async function loadMembers(){const {data,error}=await sb.from('family_members').select('user_id,display_name,role').order('display_name');if(error){$('members').innerHTML='<div class="empty danger">'+esc(error.message)+'</div>';return}membersCache=data||[];$('myAvatar').textContent=(data?.find(x=>x.user_id===currentUser.id)?.display_name||currentUser.email||'S').slice(0,1).toUpperCase();renderMembers('')}
function renderMembers(q){const list=membersCache.filter(m=>(m.display_name||'').toLowerCase().includes(q));$('members').innerHTML=list.map(m=>`<div class="member" onclick="openFamilyGroup()"><div class="avatar">${esc((m.display_name||'?').slice(0,1).toUpperCase())}</div><div class="member-info"><div class="member-name">${esc(m.display_name||'عضو خانواده')}</div><div class="member-sub">${m.role==='admin'?'مدیر خانواده':'عضو خانواده'}</div></div></div>`).join('')||'<div class="empty">عضوی پیدا نشد.</div>'}
async function openFamilyGroup(){currentConversation='family';$('headName').textContent='گروه خانواده ❤️';$('headStatus').textContent='چت خصوصی اعضای مجاز';$('headAvatar').textContent='👨‍👩‍👧‍👦';$('text').disabled=false;$('send').disabled=false;await loadMessages();subscribeRealtime()}
async function loadMessages(){const {data,error}=await sb.from('messages').select('id,sender_id,content,created_at').order('created_at',{ascending:true}).limit(500);if(error){$('messages').innerHTML='<div class="empty danger">'+esc(error.message)+'</div>';return}$('messages').innerHTML='';(data||[]).forEach(renderMessage);$('messages').scrollTop=$('messages').scrollHeight}
function renderMessage(m){const sender=membersCache.find(x=>x.user_id===m.sender_id);const el=document.createElement('div');el.className='bubble '+(m.sender_id===currentUser.id?'me':'other');el.innerHTML=(m.sender_id!==currentUser.id?`<div class="sender">${esc(sender?.display_name||'عضو خانواده')}</div>`:'')+esc(m.content);$('messages').appendChild(el)}
function subscribeRealtime(){if(realtimeChannel)sb.removeChannel(realtimeChannel);realtimeChannel=sb.channel('family-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{if(payload.new.sender_id!==currentUser.id)renderMessage(payload.new);$('messages').scrollTop=$('messages').scrollHeight}).subscribe()}
async function sendMessage(){const content=$('text').value.trim();if(!content)return;const {error}=await sb.from('messages').insert({sender_id:currentUser.id,content});if(error){alert(error.message);return}$('text').value=''}
if(configured)sb.auth.onAuthStateChange((_e,s)=>{if(s&&!currentUser){currentUser=s.user;boot()}});boot();
</script>
</body>
</html>
