<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Sobhan Dino | Pug62</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#050816;
}

/* =========================
   GIFT SCREEN
========================= */

.gift-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 15%,#7c3aed55,transparent 30%),
    radial-gradient(circle at 15% 90%,#ec489944,transparent 30%),
    linear-gradient(135deg,#030712,#111827,#030712);
}

.stars{
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1px),
    radial-gradient(circle,#fff 1px,transparent 1px);
  background-size:80px 80px,130px 130px;
  background-position:10px 20px,50px 70px;
  opacity:.25;
  animation:starsMove 15s linear infinite;
}

@keyframes starsMove{
  from{transform:translateY(0)}
  to{transform:translateY(80px)}
}

.gift-card{
  position:relative;
  z-index:2;
  width:min(520px,94vw);
  padding:42px 28px;
  text-align:center;
  border-radius:32px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  box-shadow:
    0 30px 100px rgba(0,0,0,.65),
    inset 0 1px rgba(255,255,255,.2);
  animation:cardIn .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(50px) scale(.88);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.gift-icon{
  font-size:90px;
  display:block;
  filter:drop-shadow(0 15px 25px rgba(0,0,0,.5));
  animation:giftFloat 2s ease-in-out infinite;
}

@keyframes giftFloat{
  0%,100%{
    transform:translateY(0) rotate(-3deg);
  }
  50%{
    transform:translateY(-14px) rotate(3deg);
  }
}

.gift-card h1{
  margin-top:15px;
  color:#fff;
  font-size:32px;
  font-weight:900;
}

.gift-card h2{
  margin-top:10px;
  color:#fbbf24;
  font-size:25px;
}

.gift-card p{
  margin:18px auto;
  max-width:420px;
  color:#ddd;
  line-height:2;
  font-size:15px;
}

.creator{
  color:#aaa!important;
  font-size:13px!important;
}

.gift-button{
  width:100%;
  margin-top:8px;
  padding:17px;
  border:0;
  border-radius:17px;
  cursor:pointer;
  color:#fff;
  font-size:18px;
  font-weight:900;
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  box-shadow:0 12px 35px rgba(239,68,68,.3);
  transition:.2s;
}

.gift-button:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 45px rgba(239,68,68,.4);
}

.gift-button:active{
  transform:scale(.97);
}

/* =========================
   GAME
========================= */

.game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(#bfe9ff 0%,#e9f8ff 65%,#fff 100%);
  transition:background .7s;
}

body.night .game{
  background:
    linear-gradient(#071225 0%,#111c32 65%,#182438 100%);
}

/* HEADER */

.header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 25px;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  font-size:30px;
}

.brand-name{
  color:#172033;
  font-weight:1000;
  font-size:21px;
  letter-spacing:.5px;
}

body.night .brand-name{
  color:#fff;
}

.scores{
  display:flex;
  gap:10px;
}

.score-card{
  min-width:110px;
  padding:9px 13px;
  border-radius:13px;
  background:rgba(255,255,255,.7);
  border:1px solid rgba(0,0,0,.08);
  text-align:center;
  direction:ltr;
  box-shadow:0 7px 20px rgba(0,0,0,.08);
}

body.night .score-card{
  background:rgba(255,255,255,.08);
  color:#fff;
  border-color:#ffffff18;
}

.score-title{
  display:block;
  font-size:10px;
  opacity:.6;
  margin-bottom:3px;
}

.score-number{
  font-size:17px;
  font-weight:900;
}

.actions{
  display:flex;
  gap:7px;
}

.action{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.8);
  cursor:pointer;
  font-size:18px;
  box-shadow:0 7px 20px rgba(0,0,0,.1);
  transition:.2s;
}

.action:hover{
  transform:translateY(-2px);
}

body.night .action{
  background:#ffffff12;
  color:#fff;
}

/* VOLUME */

.volume{
  position:absolute;
  top:70px;
  left:25px;
  padding:14px;
  width:190px;
  border-radius:16px;
  background:#fff;
  box-shadow:0 15px 35px #0003;
  display:none;
  z-index:200;
}

.volume.show{
  display:block;
}

body.night .volume{
  background:#1d293d;
  color:#fff;
}

.volume input{
  width:100%;
  margin-top:10px;
}

/* WORLD */

.world{
  position:absolute;
  inset:80px 0 75px;
  overflow:hidden;
}

/* SUN */

.sun{
  position:absolute;
  top:35px;
  right:10%;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#ffd84a;
  box-shadow:0 0 55px #ffd84a99;
}

.moon{
  display:none;
  position:absolute;
  top:35px;
  right:10%;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#f8fafc;
  box-shadow:0 0 45px #fff8;
}

body.night .sun{
  display:none;
}

body.night .moon{
  display:block;
}

/* CLOUDS */

.cloud{
  position:absolute;
  width:130px;
  height:35px;
  border-radius:40px;
  background:#fff;
  opacity:.72;
  animation:cloudMove 35s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:#fff;
}

.cloud:before{
  width:50px;
  height:50px;
  left:20px;
  top:-25px;
}

.cloud:after{
  width:60px;
  height:60px;
  right:18px;
  top:-32px;
}

.cloud.one{
  top:85px;
  left:-180px;
}

.cloud.two{
  top:175px;
  left:-400px;
  transform:scale(.7);
  animation-delay:-13s;
}

@keyframes cloudMove{
  from{transform:translateX(0)}
  to{transform:translateX(1400px)}
}

/* MOUNTAINS */

.mountains{
  position:absolute;
  bottom:65px;
  left:0;
  width:100%;
  height:180px;
  opacity:.35;
}

.mountain{
  position:absolute;
  bottom:0;
  width:0;
  height:0;
  border-left:130px solid transparent;
  border-right:130px solid transparent;
  border-bottom:180px solid #80a9bb;
}

.mountain.m1{left:4%}
.mountain.m2{
  left:28%;
  transform:scale(.8);
}
.mountain.m3{
  left:55%;
  transform:scale(1.1);
}
.mountain.m4{
  left:82%;
  transform:scale(.7);
}

body.night .mountain{
  border-bottom-color:#27364e;
}

/* GROUND */

.ground{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:
    linear-gradient(#d8c79b,#c4af78);
  border-top:4px solid #594f37;
}

body.night .ground{
  background:linear-gradient(#26313c,#1c2530);
  border-color:#718096;
}

.ground-lines{
  position:absolute;
  top:19px;
  width:100%;
  height:7px;
  background:repeating-linear-gradient(
    90deg,
    #685d40 0 50px,
    transparent 50px 85px
  );
  animation:groundMove .5s linear infinite;
}

body.night .ground-lines{
  background:repeating-linear-gradient(
    90deg,
    #8794a5 0 50px,
    transparent 50px 85px
  );
}

@keyframes groundMove{
  from{transform:translateX(0)}
  to{transform:translateX(-85px)}
}

/* =========================
   DINO
========================= */

.dino{
  position:absolute;
  left:110px;
  bottom:75px;
  width:68px;
  height:78px;
  z-index:50;
}

.dino-shadow{
  position:absolute;
  bottom:-8px;
  left:2px;
  width:62px;
  height:10px;
  background:#0003;
  border-radius:50%;
  filter:blur(3px);
}

.dino-head{
  position:absolute;
  right:8px;
  top:0;
  width:48px;
  height:38px;
  background:#1f2937;
  border-radius:9px 16px 5px 5px;
}

.dino-head:after{
  content:"";
  position:absolute;
  right:-10px;
  bottom:5px;
  width:15px;
  height:6px;
  background:#1f2937;
}

.dino-eye{
  position:absolute;
  right:9px;
  top:8px;
  width:6px;
  height:6px;
  background:#fff;
  border-radius:50%;
}

.dino-body{
  position:absolute;
  right:0;
  bottom:12px;
  width:45px;
  height:48px;
  background:#1f2937;
  border-radius:10px 14px 6px 6px;
}

.dino-belly{
  position:absolute;
  right:7px;
  bottom:18px;
  width:25px;
  height:27px;
  background:#374151;
  border-radius:50%;
}

.dino-tail{
  position:absolute;
  left:0;
  bottom:37px;
  width:33px;
  height:13px;
  background:#1f2937;
  transform:rotate(-27deg);
  border-radius:10px;
}

.dino-leg{
  position:absolute;
  bottom:0;
  width:10px;
  height:26px;
  background:#1f2937;
  border-radius:0 0 6px 6px;
}

.dino-leg.one{right:8px}
.dino-leg.two{right:31px}

.dino.jump{
  animation:dinoJump .68s cubic-bezier(.2,.7,.3,1);
}

@keyframes dinoJump{
  0%{bottom:75px}
  42%{bottom:255px}
  100%{bottom:75px}
}

/* DUST */

.dust{
  position:absolute;
  left:95px;
  bottom:77px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#a88958;
  opacity:0;
  z-index:30;
}

.running .dust{
  animation:dust .7s infinite;
}

@keyframes dust{
  0%{
    opacity:.7;
    transform:translate(0,0) scale(.5);
  }
  100%{
    opacity:0;
    transform:translate(-55px,8px) scale(1.5);
  }
}

/* =========================
   CACTUS
========================= */

.obstacle{
  position:absolute;
  right:-120px;
  bottom:75px;
  z-index:40;
}

.cactus{
  position:relative;
  width:34px;
  height:76px;
  border-radius:8px 8px 3px 3px;
  background:linear-gradient(90deg,#087f43,#19a85e);
  box-shadow:inset 5px 0 rgba(255,255,255,.1);
}

.cactus:before,
.cactus:after{
  content:"";
  position:absolute;
  background:#119452;
  border-radius:10px;
}

.cactus:before{
  width:17px;
  height:35px;
  left:-14px;
  top:29px;
}

.cactus:after{
  width:17px;
  height:29px;
  right:-12px;
  top:12px;
}

/* =========================
   BIRD
========================= */

.bird{
  position:relative;
  width:70px;
  height:35px;
  animation:birdFly .35s infinite alternate;
}

@keyframes birdFly{
  from{transform:translateY(0)}
  to{transform:translateY(-5px)}
}

.bird-body{
  position:absolute;
  left:12px;
  top:10px;
  width:40px;
  height:20px;
  border-radius:50%;
  background:#4b5563;
}

.bird-head{
  position:absolute;
  right:0;
  top:3px;
  width:23px;
  height:23px;
  border-radius:50%;
  background:#374151;
}

.bird-eye{
  position:absolute;
  right:6px;
  top:5px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#fff;
}

.bird-wing{
  position:absolute;
  left:0;
  top:2px;
  width:30px;
  height:14px;
  background:#374151;
  transform:rotate(25deg);
}

/* =========================
   GAME OVER
========================= */

.game-over{
  position:absolute;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(5px);
}

.over-card{
  width:min(430px,90%);
  padding:35px 25px;
  text-align:center;
  border-radius:27px;
  background:#fff;
  box-shadow:0 30px 80px #0008;
  animation:overIn .4s ease;
}

@keyframes overIn{
  from{
    opacity:0;
    transform:scale(.8);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.over-card h1{
  font-size:38px;
  margin-bottom:15px;
}

.over-card p{
  margin:10px;
  font-size:17px;
}

.restart{
  margin-top:16px;
  border:0;
  border-radius:15px;
  padding:15px 35px;
  background:#111827;
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.footer{
  position:absolute;
  bottom:12px;
  left:0;
  right:0;
  text-align:center;
  color:#555;
  font-size:12px;
  z-index:80;
}

body.night .footer{
  color:#aab4c4;
}

@media(max-width:650px){

  .header{
    height:70px;
    padding:9px 10px;
  }

  .brand-name{
    display:none;
  }

  .brand-icon{
    font-size:26px;
  }

  .score-card{
    min-width:72px;
    padding:7px;
  }

  .score-title{
    font-size:8px;
  }

  .score-number{
    font-size:13px;
  }

  .action{
    width:36px;
    height:36px;
    font-size:15px;
  }

  .world{
    inset:70px 0 65px;
  }

  .dino{
    left:55px;
    bottom:65px;
  }

  .ground{
    height:65px;
  }

  .obstacle{
    bottom:65px;
  }

  .dino-shadow{
    bottom:-8px;
  }

  .gift-card{
    padding:32px 20px;
  }

  .gift-icon{
    font-size:75px;
  }

  .gift-card h1{
    font-size:26px;
  }

  .gift-card h2{
    font-size:21px;
  }
}
</style>
</head>

<body>

<!-- =========================
     GIFT SCREEN
========================= -->

<section class="gift-screen" id="giftScreen">

  <div class="stars"></div>

  <div class="gift-card">

    <span class="gift-icon">🎁</span>

    <h1>یک هدیه برای شما</h1>

    <h2>اعضای چنل Pug62 ❤️</h2>

    <p>
      این بازی کوچک با عشق از طرف سبحان
      برای اعضای چنل Pug62 ساخته شده است.
      آماده‌ای رکورد خودت را بزنی؟ 🦖🔥
    </p>

    <p class="creator">
      ساخته شده توسط سبحان
    </p>

    <button class="gift-button" onclick="openGame()">
      🎁 دریافت هدیه و ورود به بازی
    </button>

  </div>

</section>


<!-- =========================
     GAME
========================= -->

<main class="game hidden" id="game">

  <header class="header">

    <div class="brand">
      <div class="brand-icon">🦖</div>
      <div class="brand-name">SOBHAN DINO</div>
    </div>

    <div class="scores">

      <div class="score-card">
        <span class="score-title">SCORE</span>
        <span class="score-number" id="score">00000</span>
      </div>

      <div class="score-card">
        <span class="score-title">BEST</span>
        <span class="score-number" id="best">00000</span>
      </div>

    </div>

    <div class="actions">

      <button class="action" id="soundButton" onclick="toggleSound()">
        🔊
      </button>

      <button class="action" onclick="toggleVolume()">
        🎚️
      </button>

      <button class="action" onclick="toggleNight()">
        🌙
      </button>

    </div>

    <div class="volume" id="volumeBox">

      <b>🔊 میزان صدا</b>

      <input
        type="range"
        min="0"
        max="100"
        value="35"
        id="volumeSlider"
      >

    </div>

  </header>


  <section class="world" id="world">

    <div class="sun"></div>
    <div class="moon"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

    <div class="mountains">
      <div class="mountain m1"></div>
      <div class="mountain m2"></div>
      <div class="mountain m3"></div>
      <div class="mountain m4"></div>
    </div>

    <div id="obstacles"></div>


    <!-- DINO -->

    <div class="dino" id="dino">

      <div class="dino-head">
        <div class="dino-eye"></div>
      </div>

      <div class="dino-body"></div>

      <div class="dino-belly"></div>

      <div class="dino-tail"></div>

      <div class="dino-leg one"></div>
      <div class="dino-leg two"></div>

      <div class="dino-shadow"></div>

    </div>


    <div class="dust"></div>

    <div class="ground">
      <div class="ground-lines"></div>
    </div>

  </section>


  <div class="footer">
    Space / ↑ / لمس صفحه = پرش
  </div>


  <!-- GAME OVER -->

  <div class="game-over hidden" id="gameOver">

    <div class="over-card">

      <h1>💥 Game Over</h1>

      <p>
        امتیاز:
        <b id="finalScore">0</b>
      </p>

      <p>
        بهترین رکورد:
        <b id="finalBest">0</b>
      </p>

      <button class="restart" onclick="restartGame()">
        🔄 دوباره بازی کن
      </button>

    </div>

  </div>

</main>


<!-- =========================
     MUSIC
========================= -->

<audio id="music" loop preload="auto">
  <source
    src="https://dl.musicdel.ir/Music/1404/06/Jafar-Dodakh%20-musicdel.ir.mp3"
    type="audio/mpeg"
  >
</audio>


<script>

/* =========================
   VARIABLES
========================= */

const music =
  document.getElementById("music");

const giftScreen =
  document.getElementById("giftScreen");

const game =
  document.getElementById("game");

const dino =
  document.getElementById("dino");

const obstacles =
  document.getElementById("obstacles");

const scoreEl =
  document.getElementById("score");

const bestEl =
  document.getElementById("best");

const gameOver =
  document.getElementById("gameOver");

let running = false;
let jumping = false;

let score = 0;

let best =
  Number(localStorage.getItem("sobhanDinoBest")) || 0;

let speed = 6;

let scoreTimer = null;
let obstacleTimer = null;

let soundOn = true;

let volume = .35;

let audioContext = null;


/* =========================
   INITIAL
========================= */

bestEl.textContent =
  String(best).padStart(5,"0");

music.volume = volume;


/* =========================
   OPEN GAME
========================= */

function openGame(){

  initAudio();

  giftScreen.classList.add("hidden");

  game.classList.remove("hidden");

  startGame();

}


/* =========================
   AUDIO
========================= */

function initAudio(){

  if(!audioContext){

    audioContext =
      new (window.AudioContext ||
      window.webkitAudioContext)();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

}


function sound(type){

  if(!soundOn) return;

  initAudio();

  const osc =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  const now =
    audioContext.currentTime;

  osc.connect(gain);

  gain.connect(audioContext.destination);


  if(type === "jump"){

    osc.type = "square";

    osc.frequency.setValueAtTime(
      480,now
    );

    osc.frequency.exponentialRampToValueAtTime(
      850,now+.12
    );

    gain.gain.setValueAtTime(
      .001,now
    );

    gain.gain.exponentialRampToValueAtTime(
      .14,now+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,now+.17
    );

    osc.start(now);

    osc.stop(now+.18);

  }


  if(type === "over"){

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
      300,now
    );

    osc.frequency.exponentialRampToValueAtTime(
      55,now+.65
    );

    gain.gain.setValueAtTime(
      .001,now
    );

    gain.gain.exponentialRampToValueAtTime(
      .25,now+.03
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,now+.7
    );

    osc.start(now);

    osc.stop(now+.7);

  }

}


/* =========================
   START GAME
========================= */

function startGame(){

  running = true;

  score = 0;

  speed = 6;

  jumping = false;

  scoreEl.textContent = "00000";

  obstacles.innerHTML = "";

  gameOver.classList.add("hidden");

  game.classList.add("running");


  if(soundOn){

    music.volume = volume;

    music.currentTime = 0;

    music.play().catch(()=>{});

  }


  clearInterval(scoreTimer);

  scoreTimer =
    setInterval(()=>{

      if(!running) return;

      score++;

      scoreEl.textContent =
        String(score).padStart(5,"0");


      if(score > best){

        best = score;

        localStorage.setItem(
          "sobhanDinoBest",
          best
        );

        bestEl.textContent =
          String(best).padStart(5,"0");

      }


      if(score % 100 === 0){

        speed += .6;

      }

    },100);


  createObstacle();

}


/* =========================
   JUMP
========================= */

function jump(){

  if(!running) return;

  if(jumping) return;

  jumping = true;

  sound("jump");

  dino.classList.remove("jump");

  void dino.offsetWidth;

  dino.classList.add("jump");


  setTimeout(()=>{

    dino.classList.remove("jump");

    jumping = false;

  },680);

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",(e)=>{

  if(
    e.code === "Space" ||
    e.code === "ArrowUp"
  ){

    e.preventDefault();

    jump();

  }

});


/* =========================
   TOUCH
========================= */

document.addEventListener(
  "touchstart",
  (e)=>{

    if(!running) return;

    if(
      e.target.closest(".action") ||
      e.target.closest(".volume")
    ){

      return;

    }

    jump();

  },
  {passive:true}
);


/* =========================
   OBSTACLES
========================= */

function createObstacle(){

  if(!running) return;


  const obstacle =
    document.createElement("div");

  obstacle.className =
    "obstacle";


  const isBird =
    Math.random() < .22;


  if(isBird){

    obstacle.innerHTML = `

      <div class="bird">

        <div class="bird-wing"></div>

        <div class="bird-body"></div>

        <div class="bird-head">

          <div class="bird-eye"></div>

        </div>

      </div>

    `;

    obstacle.style.bottom =
      (145 + Math.random()*65) + "px";

  }else{

    obstacle.innerHTML =
      `<div class="cactus"></div>`;

    obstacle.style.bottom =
      "75px";

  }


  obstacles.appendChild(obstacle);


  let position = -120;


  const move =
    setInterval(()=>{

      if(!running){

        clearInterval(move);

        obstacle.remove();

        return;

      }


      position += speed;

      obstacle.style.right =
        position + "px";


      if(collision(dino,obstacle)){

        clearInterval(move);

        endGame();

        return;

      }


      if(position >
        window.innerWidth + 180){

        clearInterval(move);

        obstacle.remove();

      }

    },20);


  obstacleTimer =
    setTimeout(
      createObstacle,
      Math.max(
        650,
        1500 - speed*45
      ) + Math.random()*750
    );

}


/* =========================
   COLLISION
========================= */

function collision(a,b){

  const A =
    a.getBoundingClientRect();

  const B =
    b.getBoundingClientRect();

  const padding = 10;


  return !(
    A.right-padding < B.left ||
    A.left+padding > B.right ||
    A.bottom-padding < B.top ||
    A.top+padding > B.bottom
  );

}


/* =========================
   GAME OVER
========================= */

function endGame(){

  if(!running) return;

  running = false;

  clearInterval(scoreTimer);

  clearTimeout(obstacleTimer);

  game.classList.remove("running");

  music.pause();

  sound("over");


  document.getElementById(
    "finalScore"
  ).textContent = score;


  document.getElementById(
    "finalBest"
  ).textContent = best;


  gameOver.classList.remove("hidden");

}


/* =========================
   RESTART
========================= */

function restartGame(){

  obstacles.innerHTML = "";

  gameOver.classList.add("hidden");

  startGame();

}


/* =========================
   SOUND TOGGLE
========================= */

function toggleSound(){

  soundOn = !soundOn;


  document.getElementById(
    "soundButton"
  ).textContent =
    soundOn ? "🔊" : "🔇";


  if(soundOn){

    music.volume = volume;

    if(running){
      music.play().catch(()=>{});
    }

  }else{

    music.pause();

  }

}


/* =========================
   VOLUME
========================= */

function toggleVolume(){

  document
    .getElementById("volumeBox")
    .classList.toggle("show");

}


document
  .getElementById("volumeSlider")
  .addEventListener(
    "input",
    function(){

      volume =
        Number(this.value)/100;

      music.volume =
        soundOn ? volume : 0;

    }
  );


/* =========================
   NIGHT
========================= */

function toggleNight(){

  document.body.classList.toggle("night");

}

</script>

</body>
