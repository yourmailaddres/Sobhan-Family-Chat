<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Sobhan Dino</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#f7f7f7;
    font-family:Arial,Tahoma,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#f7f7f7;
}

/* HEADER */

#header{
    position:absolute;
    top:18px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:35px;
    z-index:20;
    font-weight:bold;
    font-size:18px;
    color:#555;
}

#score,
#highScore{
    min-width:130px;
    text-align:center;
}

/* SKY */

#sky{
    position:absolute;
    inset:0;
    background:linear-gradient(
        #f7f7f7 0%,
        #f7f7f7 72%,
        #eeeeee 72%,
        #eeeeee 100%
    );
}

/* SUN */

#sun{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#ffd84d;
    right:12%;
    top:15%;
    box-shadow:0 0 35px #ffd84d88;
}

/* CLOUDS */

.cloud{
    position:absolute;
    width:100px;
    height:25px;
    border-radius:30px;
    background:#ddd;
    opacity:.65;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:#ddd;
}

.cloud:before{
    width:45px;
    height:45px;
    left:18px;
    top:-20px;
}

.cloud:after{
    width:55px;
    height:55px;
    right:15px;
    top:-30px;
}

.c1{
    top:20%;
    left:15%;
}

.c2{
    top:34%;
    left:55%;
    transform:scale(.7);
}

.c3{
    top:12%;
    left:75%;
    transform:scale(.5);
}

/* GROUND */

#ground{
    position:absolute;
    left:0;
    bottom:22%;
    width:100%;
    height:4px;
    background:#555;
}

#groundLines{
    position:absolute;
    left:0;
    bottom:calc(22% - 25px);
    width:100%;
    height:35px;
    overflow:hidden;
}

.line{
    position:absolute;
    height:3px;
    background:#777;
}

/* PLAYER */

#dino{
    position:absolute;
    width:58px;
    height:65px;
    bottom:calc(22% + 5px);
    left:12%;
    z-index:10;
}

.dino-body{
    position:absolute;
    width:38px;
    height:40px;
    background:#333;
    right:5px;
    bottom:5px;
    border-radius:5px 12px 4px 4px;
}

.dino-head{
    position:absolute;
    width:38px;
    height:30px;
    background:#333;
    right:0;
    top:0;
    border-radius:7px 10px 2px 2px;
}

.dino-head:after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    background:white;
    border-radius:50%;
    right:8px;
    top:7px;
}

.dino-neck{
    position:absolute;
    width:12px;
    height:25px;
    background:#333;
    right:27px;
    top:20px;
}

.leg{
    position:absolute;
    width:8px;
    height:25px;
    background:#333;
    bottom:0;
}

.leg1{
    right:28px;
}

.leg2{
    right:10px;
}

.tail{
    position:absolute;
    width:35px;
    height:8px;
    background:#333;
    left:0;
    bottom:22px;
    transform:rotate(-18deg);
    transform-origin:right;
}

/* CACTUS */

.cactus{
    position:absolute;
    bottom:calc(22% + 5px);
    width:25px;
    height:55px;
    z-index:9;
}

.cactus-main{
    position:absolute;
    width:15px;
    height:55px;
    background:#333;
    left:5px;
    bottom:0;
    border-radius:3px;
}

.cactus-arm{
    position:absolute;
    width:11px;
    height:30px;
    background:#333;
    border-radius:3px;
}

.cactus-arm.left{
    left:-3px;
    top:25px;
}

.cactus-arm.right{
    right:-3px;
    top:12px;
}

/* BIRD */

.bird{
    position:absolute;
    width:45px;
    height:25px;
    z-index:8;
}

.bird-body{
    position:absolute;
    width:18px;
    height:10px;
    background:#555;
    left:13px;
    top:8px;
}

.wing{
    position:absolute;
    width:22px;
    height:8px;
    border-top:4px solid #555;
}

.wing.left{
    left:0;
    top:2px;
    transform:rotate(20deg);
}

.wing.right{
    right:0;
    top:2px;
    transform:rotate(-20deg);
}

/* START SCREEN */

#startScreen,
#gameOver{
    position:absolute;
    inset:0;
    z-index:50;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#f7f7f7dd;
    backdrop-filter:blur(4px);
}

.title{
    font-size:55px;
    font-weight:900;
    color:#222;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
    font-size:18px;
}

button{
    border:0;
    background:#333;
    color:white;
    padding:14px 32px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:active{
    transform:scale(.96);
}

.hidden{
    display:none!important;
}

#finalScore{
    font-size:20px;
    margin-bottom:20px;
    color:#444;
}

/* MOBILE */

#mobileHint{
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    color:#888;
    font-size:14px;
    z-index:30;
}

@media(max-width:600px){

    #header{
        font-size:14px;
        gap:10px;
    }

    #score,
    #highScore{
        min-width:105px;
    }

    .title{
        font-size:40px;
    }

    #mobileHint{
        display:block;
    }
}

@media(min-width:601px){
    #mobileHint{
        display:none;
    }
}

/* NIGHT */

.night #sky{
    background:linear-gradient(
        #182235 0%,
        #182235 72%,
        #111820 72%,
        #111820 100%
    );
}

.night #sun{
    background:#eee;
    box-shadow:0 0 20px #fff8;
}

.night .cloud{
    background:#303b4d;
}

.night .cloud:before,
.night .cloud:after{
    background:#303b4d;
}

.night #ground{
    background:#aaa;
}

.night #groundLines .line{
    background:#777;
}

.night .title{
    color:white;
}

.night #startScreen,
.night #gameOver{
    background:#182235dd;
}

.night .subtitle,
.night #finalScore{
    color:#ddd;
}

.night #mobileHint{
    color:#aaa;
}
</style>
</head>

<body>

<div id="game">

    <div id="sky"></div>

    <div id="sun"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div id="header">
        <div id="score">امتیاز: 00000</div>
        <div id="highScore">رکورد: 00000</div>
    </div>

    <div id="ground"></div>
    <div id="groundLines"></div>

    <!-- DINO -->

    <div id="dino">

        <div class="tail"></div>

        <div class="dino-body"></div>

        <div class="dino-neck"></div>

        <div class="dino-head"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>

    </div>

    <div id="mobileHint">
        برای پرش روی صفحه ضربه بزن
    </div>

    <!-- START -->

    <div id="startScreen">

        <div class="title">
            🦖 DINO
        </div>

        <div class="subtitle">
            بازی Dino - ساخته شده برای Sobhan
        </div>

        <button id="startButton">
            شروع بازی
        </button>

    </div>

    <!-- GAME OVER -->

    <div id="gameOver" class="hidden">

        <div class="title">
            GAME OVER
        </div>

        <div id="finalScore">
            امتیاز: 0
        </div>

        <button id="restartButton">
            دوباره بازی کن
        </button>

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

const game =
document.getElementById("game");

const dino =
document.getElementById("dino");

const scoreText =
document.getElementById("score");

const highScoreText =
document.getElementById("highScore");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOver");

const finalScore =
document.getElementById("finalScore");

const startButton =
document.getElementById("startButton");

const restartButton =
document.getElementById("restartButton");

const groundLines =
document.getElementById("groundLines");


let running=false;

let score=0;

let highScore=
Number(localStorage.getItem("sobhanDinoHighScore") || 0);

let speed=7;

let gravity=.8;

let velocityY=0;

let dinoY=0;

let jumping=false;

let lastTime=0;

let obstacleTimer=0;

let birdTimer=0;

let groundTimer=0;

let nightTimer=0;

let obstacles=[];

let birds=[];


/* =========================
   HIGH SCORE
========================= */

function updateHighScore(){

    highScoreText.textContent =
        "رکورد: " +
        String(highScore).padStart(5,"0");

}

updateHighScore();


/* =========================
   START
========================= */

function startGame(){

    startScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

    running=true;

    score=0;

    speed=7;

    velocityY=0;

    dinoY=0;

    jumping=false;

    obstacleTimer=0;

    birdTimer=0;

    nightTimer=0;

    obstacles.forEach(
        x=>x.remove()
    );

    birds.forEach(
        x=>x.remove()
    );

    obstacles=[];

    birds=[];

    game.classList.remove("night");

    updateScore();

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);

}


/* =========================
   SCORE
========================= */

function updateScore(){

    scoreText.textContent =
        "امتیاز: " +
        String(Math.floor(score))
        .padStart(5,"0");

}


/* =========================
   JUMP
========================= */

function jump(){

    if(!running){
        return;
    }

    if(!jumping){

        velocityY=16;

        jumping=true;

    }

}


/* =========================
   CREATE CACTUS
========================= */

function createCactus(){

    const cactus =
        document.createElement("div");

    cactus.className="cactus";

    cactus.innerHTML=`
        <div class="cactus-main"></div>
        <div class="cactus-arm left"></div>
        <div class="cactus-arm right"></div>
    `;

    cactus.style.left =
        window.innerWidth + 40 + "px";

    game.appendChild(cactus);

    obstacles.push(cactus);

}


/* =========================
   CREATE BIRD
========================= */

function createBird(){

    const bird =
        document.createElement("div");

    bird.className="bird";

    bird.innerHTML=`
        <div class="bird-body"></div>
        <div class="wing left"></div>
        <div class="wing right"></div>
    `;

    const height =
        30 +
        Math.random()*100;

    bird.style.left =
        window.innerWidth + 40 + "px";

    bird.style.bottom =
        (22 + height/10) + "%";

    game.appendChild(bird);

    birds.push(bird);

}


/* =========================
   GROUND
========================= */

function createGroundLine(){

    const line =
        document.createElement("div");

    line.className="line";

    line.style.width =
        (20 + Math.random()*70) + "px";

    line.style.left =
        window.innerWidth + "px";

    groundLines.appendChild(line);

}


/* =========================
   COLLISION
========================= */

function collision(a,b){

    const ar =
        a.getBoundingClientRect();

    const br =
        b.getBoundingClientRect();

    const padding=8;

    return !(
        ar.right-padding < br.left ||
        ar.left+padding > br.right ||
        ar.bottom-padding < br.top ||
        ar.top+padding > br.bottom
    );

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    running=false;

    if(
        Math.floor(score) >
        highScore
    ){

        highScore =
            Math.floor(score);

        localStorage.setItem(
            "sobhanDinoHighScore",
            highScore
        );

        updateHighScore();

    }

    finalScore.textContent =
        "امتیاز: " +
        Math.floor(score);

    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time){

    if(!running){
        return;
    }

    const delta =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime=time;


    /* SCORE */

    score += .12 * delta;

    updateScore();


    /* SPEED */

    speed +=
        .0008 * delta;


    /* DINO PHYSICS */

    if(jumping){

        velocityY -=
            gravity * delta;

        dinoY +=
            velocityY * delta;


        if(dinoY <= 0){

            dinoY=0;

            velocityY=0;

            jumping=false;

        }

    }

    dino.style.transform =
        `translateY(${-dinoY}px)`;


    /* OBSTACLES */

    obstacleTimer -= delta;

    if(obstacleTimer <= 0){

        createCactus();

        obstacleTimer =
            75 +
            Math.random()*80 -
            Math.min(speed*2,35);

    }


    /* BIRDS */

    birdTimer -= delta;

    if(
        score > 100 &&
        birdTimer <= 0
    ){

        createBird();

        birdTimer =
            180 +
            Math.random()*220;

    }


    /* MOVE CACTUS */

    obstacles =
        obstacles.filter(
            cactus=>{

                const x =
                    parseFloat(
                        cactus.style.left
                    );

                const newX =
                    x -
                    speed*delta;

                cactus.style.left =
                    newX + "px";


                if(
                    collision(
                        dino,
                        cactus
                    )
                ){

                    endGame();

                }


                if(newX < -80){

                    cactus.remove();

                    return false;

                }

                return true;

            }
        );


    /* MOVE BIRDS */

    birds =
        birds.filter(
            bird=>{

                const x =
                    parseFloat(
                        bird.style.left
                    );

                const newX =
                    x -
                    speed*delta*1.15;

                bird.style.left =
                    newX + "px";


                if(
                    collision(
                        dino,
                        bird
                    )
                ){

                    endGame();

                }


                if(newX < -80){

                    bird.remove();

                    return false;

                }

                return true;

            }
        );


    /* GROUND LINES */

    groundTimer -= delta;

    if(groundTimer <= 0){

        createGroundLine();

        groundTimer=20;

    }


    Array.from(
        groundLines.children
    ).forEach(
        line=>{

            const x =
                parseFloat(
                    line.style.left
                );

            const newX =
                x -
                speed*delta;

            line.style.left =
                newX+"px";


            if(newX < -150){

                line.remove();

            }

        }
    );


    /* DAY / NIGHT */

    nightTimer +=
        delta;

    if(
        Math.floor(score)%500 === 0 &&
        Math.floor(score)>0
    ){

        game.classList.add("night");

    }

    if(
        Math.floor(score)%500 === 250
    ){

        game.classList.remove("night");

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   CONTROLS
========================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.code === "Space" ||
            event.code === "ArrowUp"
        ){

            event.preventDefault();

            if(!running){

                if(
                    !startScreen.classList.contains(
                        "hidden"
                    ) ||
                    !gameOverScreen.classList.contains(
                        "hidden"
                    )
                ){

                    startGame();

                }

            }else{

                jump();

            }

        }

    }
);


/* MOBILE */

game.addEventListener(
    "pointerdown",
    event=>{

        if(
            event.target.tagName === "BUTTON"
        ){

            return;

        }

        if(!running){

            startGame();

        }else{

            jump();

        }

    }
);


/* BUTTONS */

startButton.onclick =
    startGame;

restartButton.onclick =
    startGame;


/* =========================
   INITIAL GROUND
========================= */

for(
    let i=0;
    i<12;
    i++
){

    createGroundLine();

}

</script>

</body>
</html>
