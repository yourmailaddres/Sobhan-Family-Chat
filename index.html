<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Sobhan Dino</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f7f7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    transition:.5s;
}

body.night{
    background:#111827;
}

.game{
    width:min(1100px,96vw);
    height:min(650px,94vh);
    background:#fff;
    border:3px solid #222;
    border-radius:22px;
    position:relative;
    overflow:hidden;
    box-shadow:0 20px 60px #0003;
    transition:.5s;
}

body.night .game{
    background:#172033;
    border-color:#777;
}

.top{
    height:85px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 22px;
    position:relative;
    z-index:20;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#222;
}

body.night .logo{
    color:#fff;
}

.scoreBox{
    font-size:20px;
    font-weight:bold;
    direction:ltr;
}

body.night .scoreBox{
    color:#fff;
}

.controls{
    display:flex;
    gap:8px;
    align-items:center;
}

.btn{
    border:0;
    background:#222;
    color:#fff;
    border-radius:12px;
    padding:10px 13px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.btn:hover{
    transform:scale(1.05);
}

body.night .btn{
    background:#eee;
    color:#111;
}

.volumeBox{
    position:absolute;
    top:75px;
    left:20px;
    background:#fff;
    border:2px solid #222;
    border-radius:14px;
    padding:12px;
    display:none;
    z-index:50;
    box-shadow:0 8px 25px #0003;
}

body.night .volumeBox{
    background:#222b3d;
    border-color:#777;
}

.volumeBox.show{
    display:block;
}

.volumeBox label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

#volume{
    width:150px;
}

.sky{
    position:absolute;
    left:0;
    right:0;
    top:85px;
    bottom:75px;
    overflow:hidden;
}

.sun{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#ffd83d;
    top:35px;
    right:90px;
    box-shadow:0 0 35px #ffd83d88;
}

.moon{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#f5f5f5;
    top:35px;
    right:90px;
    box-shadow:0 0 30px #fff8;
    display:none;
}

body.night .sun{
    display:none;
}

body.night .moon{
    display:block;
}

.cloud{
    position:absolute;
    width:110px;
    height:30px;
    background:#fff;
    border-radius:30px;
    opacity:.8;
    animation:cloudMove 35s linear infinite;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
}

.cloud:before{
    width:45px;
    height:45px;
    left:20px;
    top:-20px;
}

.cloud:after{
    width:55px;
    height:55px;
    right:15px;
    top:-28px;
}

.cloud1{
    top:75px;
    left:-150px;
}

.cloud2{
    top:155px;
    left:-350px;
    animation-delay:-15s;
    transform:scale(.7);
}

@keyframes cloudMove{
    from{transform:translateX(0)}
    to{transform:translateX(1300px)}
}

.ground{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:75px;
    border-top:4px solid #333;
}

body.night .ground{
    border-color:#ddd;
}

.groundLine{
    position:absolute;
    width:100%;
    height:8px;
    top:18px;
    background:repeating-linear-gradient(
        90deg,
        #333 0px,
        #333 45px,
        transparent 45px,
        transparent 80px
    );
    animation:groundMove .45s linear infinite;
}

body.night .groundLine{
    background:repeating-linear-gradient(
        90deg,
        #ddd 0px,
        #ddd 45px,
        transparent 45px,
        transparent 80px
    );
}

@keyframes groundMove{
    from{transform:translateX(0)}
    to{transform:translateX(-80px)}
}

.dino{
    position:absolute;
    bottom:73px;
    left:100px;
    width:55px;
    height:65px;
    z-index:10;
}

.dinoBody{
    position:absolute;
    width:38px;
    height:42px;
    right:0;
    bottom:10px;
    background:#222;
    border-radius:8px 13px 5px 5px;
}

.dinoHead{
    position:absolute;
    width:40px;
    height:32px;
    right:12px;
    top:0;
    background:#222;
    border-radius:8px 12px 3px 3px;
}

.eye{
    position:absolute;
    width:5px;
    height:5px;
    background:#fff;
    right:9px;
    top:7px;
    border-radius:50%;
}

.tail{
    position:absolute;
    width:27px;
    height:12px;
    background:#222;
    left:0;
    bottom:28px;
    transform:rotate(-25deg);
    border-radius:10px;
}

.leg{
    position:absolute;
    width:9px;
    height:23px;
    background:#222;
    bottom:0;
    border-radius:0 0 5px 5px;
}

.leg1{right:9px}
.leg2{right:28px}

.dino.jump{
    animation:jump .65s ease-out;
}

@keyframes jump{
    0%{bottom:73px}
    45%{bottom:235px}
    100%{bottom:73px}
}

.obstacle{
    position:absolute;
    bottom:73px;
    right:-80px;
    z-index:9;
}

.cactus{
    width:30px;
    height:65px;
    background:#198754;
    border-radius:5px 5px 2px 2px;
}

.cactus:before,
.cactus:after{
    content:"";
    position:absolute;
    background:#198754;
    width:15px;
    border-radius:8px;
}

.cactus:before{
    height:30px;
    left:-12px;
    top:22px;
}

.cactus:after{
    height:24px;
    right:-10px;
    top:10px;
}

.bird{
    width:58px;
    height:30px;
}

.birdBody{
    position:absolute;
    width:35px;
    height:18px;
    background:#555;
    border-radius:50%;
    top:8px;
    left:10px;
}

.birdWing{
    position:absolute;
    width:28px;
    height:12px;
    background:#555;
    left:0;
    top:2px;
    transform:rotate(25deg);
}

.birdHead{
    position:absolute;
    width:20px;
    height:20px;
    background:#555;
    right:0;
    top:2px;
    border-radius:50%;
}

.birdEye{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    right:5px;
    top:5px;
    border-radius:50%;
}

.startScreen,
.gameOverScreen{
    position:absolute;
    inset:0;
    background:#0008;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100;
}

.card{
    background:#fff;
    color:#222;
    padding:30px;
    width:min(430px,90%);
    border-radius:22px;
    text-align:center;
    box-shadow:0 15px 50px #0006;
}

body.night .card{
    background:#202b3d;
    color:#fff;
}

.card h1{
    font-size:34px;
    margin-bottom:12px;
}

.card p{
    margin:10px 0;
    line-height:1.8;
}

.startBtn{
    margin-top:15px;
    border:0;
    background:#111;
    color:#fff;
    padding:15px 35px;
    border-radius:14px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

body.night .startBtn{
    background:#fff;
    color:#111;
}

.hidden{
    display:none!important;
}

.bottomInfo{
    position:absolute;
    bottom:12px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:13px;
    color:#777;
    z-index:20;
}

body.night .bottomInfo{
    color:#bbb;
}

@media(max-width:600px){
    .game{
        width:100vw;
        height:100vh;
        border-radius:0;
        border:0;
    }

    .top{
        height:75px;
        padding:12px;
    }

    .logo{
        font-size:19px;
    }

    .scoreBox{
        font-size:16px;
    }

    .btn{
        padding:8px 9px;
        font-size:14px;
    }

    .dino{
        left:55px;
    }

    .sun,.moon{
        right:35px;
    }

    .sky{
        top:75px;
    }

    .ground{
        height:65px;
    }

    .dino,
    .obstacle{
        bottom:63px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="top">

        <div class="logo">
            🦖 SOBHAN DINO
        </div>

        <div class="scoreBox">
            SCORE: <span id="score">00000</span>
            &nbsp;&nbsp;
            HI: <span id="highScore">00000</span>
        </div>

        <div class="controls">

            <button class="btn" id="soundBtn" onclick="toggleSound()">
                🔊
            </button>

            <button class="btn" onclick="toggleVolume()">
                🎚️
            </button>

            <button class="btn" onclick="toggleNight()">
                🌙
            </button>

        </div>

        <div class="volumeBox" id="volumeBox">
            <label>ولوم آهنگ</label>
            <input
                id="volume"
                type="range"
                min="0"
                max="100"
                value="35"
                oninput="changeVolume(this.value)"
            >
        </div>

    </div>

    <div class="sky">

        <div class="sun"></div>
        <div class="moon"></div>

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <div id="obstacles"></div>

        <div class="dino" id="dino">

            <div class="dinoHead">
                <div class="eye"></div>
            </div>

            <div class="dinoBody"></div>

            <div class="tail"></div>

            <div class="leg leg1"></div>
            <div class="leg leg2"></div>

        </div>

        <div class="ground">
            <div class="groundLine"></div>
        </div>

    </div>

    <div class="bottomInfo">
        Space / ↑ / لمس صفحه = پرش
    </div>


    <!-- START -->

    <div class="startScreen" id="startScreen">

        <div class="card">

            <h1>🦖 SOBHAN DINO</h1>

            <p>
                آماده‌ای رکورد بزنی؟ 🔥
            </p>

            <p>
                با پرش از کاکتوس‌ها و پرنده‌ها عبور کن.
            </p>

            <button class="startBtn" onclick="startGame()">
                ▶ شروع بازی
            </button>

        </div>

    </div>


    <!-- GAME OVER -->

    <div class="gameOverScreen hidden" id="gameOverScreen">

        <div class="card">

            <h1>💥 GAME OVER</h1>

            <p>
                امتیاز شما:
                <strong id="finalScore">0</strong>
            </p>

            <p>
                رکورد:
                <strong id="finalHighScore">0</strong>
            </p>

            <button class="startBtn" onclick="restartGame()">
                🔄 دوباره بازی کن
            </button>

        </div>

    </div>

</div>


<!-- آهنگ اصلی -->

<audio
    id="bgMusic"
    loop
    preload="auto"
>
    <source
        src="https://dl.musicdel.ir/Music/1404/06/Jafar-Dodakh%20-musicdel.ir.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

/* =========================
   SETTINGS
========================= */

const bgMusic = document.getElementById("bgMusic");

let soundEnabled = true;
let volume = 0.35;

let gameRunning = false;
let gameOver = false;

let score = 0;

let highScore =
    Number(localStorage.getItem("sobhanDinoHighScore")) || 0;

let speed = 6;

let obstacleTimer = null;
let scoreTimer = null;

const dino =
    document.getElementById("dino");

const obstacles =
    document.getElementById("obstacles");

const scoreElement =
    document.getElementById("score");

const highScoreElement =
    document.getElementById("highScore");

const startScreen =
    document.getElementById("startScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const finalScore =
    document.getElementById("finalScore");

const finalHighScore =
    document.getElementById("finalHighScore");

const soundBtn =
    document.getElementById("soundBtn");

highScoreElement.textContent =
    String(highScore).padStart(5,"0");

bgMusic.volume = volume;


/* =========================
   AUDIO ENGINE
========================= */

let audioContext = null;

function initAudio(){

    if(!audioContext){

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}


/* صدای پرش */

function jumpSound(){

    if(!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
        520,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        850,
        audioContext.currentTime + 0.12
    );

    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.13,
        audioContext.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.16
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.17
    );
}


/* صدای Game Over */

function gameOverSound(){

    if(!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sawtooth";

    oscillator.frequency.setValueAtTime(
        280,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        70,
        audioContext.currentTime + 0.55
    );

    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.25,
        audioContext.currentTime + 0.03
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.6
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.62
    );
}


/* =========================
   SOUND BUTTON
========================= */

function toggleSound(){

    soundEnabled = !soundEnabled;

    if(soundEnabled){

        soundBtn.textContent = "🔊";

        if(gameRunning){

            bgMusic.play().catch(()=>{});

        }

    }else{

        soundBtn.textContent = "🔇";

        bgMusic.pause();

    }
}


/* =========================
   VOLUME
========================= */

function toggleVolume(){

    document
        .getElementById("volumeBox")
        .classList.toggle("show");

}

function changeVolume(value){

    volume =
        Number(value) / 100;

    bgMusic.volume =
        soundEnabled ? volume : 0;

}


/* =========================
   NIGHT MODE
========================= */

function toggleNight(){

    document.body.classList.toggle("night");

}


/* =========================
   START GAME
========================= */

function startGame(){

    initAudio();

    gameRunning = true;
    gameOver = false;

    score = 0;
    speed = 6;

    scoreElement.textContent = "00000";

    startScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

    obstacles.innerHTML = "";

    if(soundEnabled){

        bgMusic.volume = volume;

        bgMusic.currentTime = 0;

        bgMusic.play().catch(()=>{});

    }

    startScore();

    createObstacle();

}


/* =========================
   SCORE
========================= */

function startScore(){

    clearInterval(scoreTimer);

    scoreTimer = setInterval(()=>{

        if(!gameRunning) return;

        score++;

        scoreElement.textContent =
            String(score).padStart(5,"0");

        if(score > highScore){

            highScore = score;

            localStorage.setItem(
                "sobhanDinoHighScore",
                highScore
            );

            highScoreElement.textContent =
                String(highScore).padStart(5,"0");
        }

        /* افزایش سرعت */

        if(score % 100 === 0){

            speed += 0.7;

        }

    },100);

}


/* =========================
   JUMP
========================= */

let jumping = false;

function jump(){

    if(!gameRunning) return;

    if(jumping) return;

    jumping = true;

    jumpSound();

    dino.classList.add("jump");

    setTimeout(()=>{

        dino.classList.remove("jump");

        jumping = false;

    },650);

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){

            e.preventDefault();

            jump();

        }

    }
);


/* =========================
   MOBILE TOUCH
========================= */

document.addEventListener(
    "touchstart",
    function(e){

        if(!gameRunning) return;

        if(
            e.target.closest(".btn") ||
            e.target.closest(".volumeBox")
        ){

            return;

        }

        jump();

    },
    {passive:true}
);


/* =========================
   OBSTACLES
========================= */

function createObstacle(){

    if(!gameRunning) return;

    const obstacle =
        document.createElement("div");

    obstacle.className = "obstacle";

    const isBird =
        Math.random() < 0.22;

    if(isBird){

        obstacle.innerHTML = `
            <div class="bird">
                <div class="birdWing"></div>
                <div class="birdBody"></div>
                <div class="birdHead">
                    <div class="birdEye"></div>
                </div>
            </div>
        `;

        obstacle.style.bottom =
            (145 + Math.random()*65) + "px";

    }else{

        obstacle.innerHTML = `
            <div class="cactus"></div>
        `;

        obstacle.style.bottom =
            "73px";

    }

    obstacles.appendChild(obstacle);

    let position = -80;

    const move =
        setInterval(()=>{

            if(!gameRunning){

                clearInterval(move);

                obstacle.remove();

                return;

            }

            position += speed;

            obstacle.style.right =
                position + "px";

            if(checkCollision(dino,obstacle)){

                clearInterval(move);

                endGame();

                return;

            }

            if(position > window.innerWidth + 150){

                clearInterval(move);

                obstacle.remove();

            }

        },20);

    const nextTime =
        Math.max(
            700,
            1500 - speed*50
        );

    obstacleTimer =
        setTimeout(
            createObstacle,
            nextTime + Math.random()*800
        );

}


/* =========================
   COLLISION
========================= */

function checkCollision(a,b){

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();

    const padding = 9;

    return !(
        r1.right - padding < r2.left ||
        r1.left + padding > r2.right ||
        r1.bottom - padding < r2.top ||
        r1.top + padding > r2.bottom
    );

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    if(!gameRunning) return;

    gameRunning = false;

    gameOver = true;

    clearInterval(scoreTimer);

    clearTimeout(obstacleTimer);

    bgMusic.pause();

    gameOverSound();

    finalScore.textContent =
        score;

    finalHighScore.textContent =
        highScore;

    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* =========================
   RESTART
========================= */

function restartGame(){

    obstacles.innerHTML = "";

    dino.classList.remove("jump");

    jumping = false;

    startGame();

}


/* =========================
   PREVENT LONG PRESS
========================= */

document.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);


/* =========================
   INITIAL
========================= */

bgMusic.volume = volume;

highScoreElement.textContent =
    String(highScore).padStart(5,"0");

</script>

</body>
</html>
